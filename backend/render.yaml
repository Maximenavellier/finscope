services:
  - type: web
    name: finscope-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_PIN
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: CACHE_TTL_QUOTE_MINUTES
        value: "15"
      - key: CACHE_TTL_FUNDAMENTALS_HOURS
        value: "24"
      - key: PEER_FETCH_CONCURRENCY
        value: "3"
